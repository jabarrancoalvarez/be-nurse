<div class="flip-card" [class.flip-card--flipped]="flipped()" [style.height.px]="height()">
  <div class="flip-card__inner">

    <div #front class="flip-card__face flip-card__face--front"
         (click)="toggle()" [attr.inert]="flipped() ? '' : null">
      <div class="flip-card__content">
        <ng-content select="[front]"></ng-content>
        <button type="button" class="flip-card__toggle"
                [attr.aria-expanded]="flipped()" [attr.aria-controls]="panelId">
          {{ frontLabel() }}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
    </div>

    <div #back [id]="panelId" class="flip-card__face flip-card__face--back"
         [attr.inert]="flipped() ? null : ''">
      <div class="flip-card__content">
        <ng-content select="[back]"></ng-content>
        <button type="button" class="flip-card__toggle"
                (click)="toggle()" [attr.aria-expanded]="flipped()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
          </svg>
          {{ backLabel() }}
        </button>
      </div>
    </div>

  </div>
</div>
